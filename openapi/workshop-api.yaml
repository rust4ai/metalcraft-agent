openapi: 3.0.3
info:
  title: Metalcraft Workshop API
  description: REST API for remote management of metalcraft-agent projects
  version: 1.0.0

servers:
  - url: http://localhost:3002
    description: Local development

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    PersonaSummary:
      type: object
      required: [slug, name, description]
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string

    Persona:
      type: object
      required: [name, description, tools, system_prompt]
      properties:
        name:
          type: string
        description:
          type: string
        tools:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        system_prompt:
          type: string

    SkillSummary:
      type: object
      required: [slug, description]
      properties:
        slug:
          type: string
        description:
          type: string

    Skill:
      type: object
      required: [slug, description, body]
      properties:
        slug:
          type: string
        description:
          type: string
        body:
          type: string

    FlowSummary:
      type: object
      required: [id, name, node_count, created_at, updated_at, enabled]
      properties:
        id:
          type: string
        name:
          type: string
        node_count:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
        enabled:
          type: boolean

    SavedFlow:
      type: object
      required: [id, name, created_at, updated_at, flow]
      properties:
        spec_version:
          type: string
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        enabled:
          type: boolean
        flow:
          type: object

    DiagnosticsSessionSummary:
      type: object
      required: [id, timestamp]
      properties:
        id:
          type: string
        timestamp:
          type: string
        persona_slug:
          type: string
        model_name:
          type: string

    SessionInfo:
      type: object
      properties:
        timestamp:
          type: string
        persona_name:
          type: string
        persona_slug:
          type: string
        model_name:
          type: string
        cwd:
          type: string
        system_prompt:
          type: string
        tools:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        auto_approve:
          type: boolean

    DiagnosticsSession:
      type: object
      required: [id]
      properties:
        id:
          type: string
        session_info:
          $ref: '#/components/schemas/SessionInfo'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEvent'

    TimelineEvent:
      type: object
      required: [kind, file]
      properties:
        kind:
          type: string
          enum: [turn, llm_request, config_change, compaction]
        file:
          type: string
        data:
          type: object

    ApiToolConfig:
      type: object
      required: [name, description, method, url, parameters]
      properties:
        name:
          type: string
        description:
          type: string
        method:
          type: string
        url:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        parameters:
          type: object
        body_mapping:
          type: string
        body_template:
          type: string
        body_defaults:
          type: object

    ApiToolSummary:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string

    ProjectLayout:
      type: object
      required: [data_dir, personas_dir, skills_dir, flows_dir, logs_dir, api_tools_dir]
      properties:
        data_dir:
          type: string
        personas_dir:
          type: string
        skills_dir:
          type: string
        flows_dir:
          type: string
        logs_dir:
          type: string
        api_tools_dir:
          type: string

    ProjectSnapshot:
      type: object
      required: [personas, skills, flows, sessions, api_tools, layout]
      properties:
        personas:
          type: array
          items:
            $ref: '#/components/schemas/PersonaSummary'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillSummary'
        flows:
          type: array
          items:
            $ref: '#/components/schemas/FlowSummary'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticsSessionSummary'
        api_tools:
          type: array
          items:
            $ref: '#/components/schemas/ApiToolSummary'
        layout:
          $ref: '#/components/schemas/ProjectLayout'

    KeySummary:
      type: object
      required: [name, masked]
      properties:
        name:
          type: string
        masked:
          description: >-
            The stored secret with its middle redacted (e.g. `sb_l…a9b2`); short
            values are fully masked as `••••`. The raw value is never returned.
          type: string

    KeyValueBody:
      type: object
      required: [value]
      properties:
        value:
          description: The raw secret to store. Must be non-empty.
          type: string

    RecommendedKey:
      description: >-
        An env key declared in the `requires_env` of one or more *enabled*
        integration packs. `configured: false` means the key resolves from
        neither the key store nor the process environment — i.e. the packs that
        need it won't work until it's added.
      type: object
      required: [name, configured, packs]
      properties:
        name:
          type: string
        configured:
          description: Whether the key currently resolves (key store first, then env var).
          type: boolean
        packs:
          description: Sorted ids of the enabled packs that declare this key.
          type: array
          items:
            type: string

    IntegrationPackSummary:
      type: object
      required: [id, name, description, version, enabled, personas, skills, api_tools, flow_templates]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        enabled:
          type: boolean
        personas:
          description: Count of personas the pack provides.
          type: integer
        skills:
          description: Count of skills the pack provides.
          type: integer
        api_tools:
          description: Count of HTTP-API tools the pack provides.
          type: integer
        flow_templates:
          description: Count of flow templates the pack provides.
          type: integer
        requires_env:
          description: Env keys the pack's tools reference (declarative; not enforced on enable).
          type: array
          items:
            type: string

    IntegrationPackDetail:
      type: object
      required: [id, name, description, version, enabled, personas, skills, api_tools, flow_templates]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        enabled:
          type: boolean
        requires_env:
          description: Env keys the pack's tools reference (declarative; not enforced on enable).
          type: array
          items:
            type: string
        personas:
          description: Slugs of personas the pack provides.
          type: array
          items:
            type: string
        skills:
          description: Slugs of skills the pack provides.
          type: array
          items:
            type: string
        api_tools:
          description: Names of HTTP-API tools the pack provides.
          type: array
          items:
            type: string
        flow_templates:
          description: Slugs of flow templates the pack provides.
          type: array
          items:
            type: string

    SetEnabledRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    RunFlowRequest:
      description: Optional overrides for a flow run. An empty body is valid.
      type: object
      properties:
        persona_slug:
          description: Persona to run the flow's prompts as. Defaults to `coding-agent`.
          type: string
        model_name:
          description: Model override. Defaults to the server's default model.
          type: string

    RunFlowPromptResult:
      type: object
      required: [prompt_index, status]
      properties:
        prompt_index:
          type: integer
        status:
          type: string
          enum: [completed, interrupted, failed]
        answer:
          description: Present when status is `completed`.
          type: string
        error:
          description: Present when status is `interrupted` or `failed`.
          type: string

    RunFlowResponse:
      type: object
      required: [flow_id, prompts]
      properties:
        flow_id:
          type: string
        prompts:
          type: array
          items:
            $ref: '#/components/schemas/RunFlowPromptResult'

    FlowTemplateSummary:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
        pack_id:
          description: Id of the integration pack providing this template, if any.
          type: string

    FlowTemplate:
      type: object
      required: [slug, name, flow]
      properties:
        slug:
          type: string
        name:
          type: string
        pack_id:
          description: Id of the integration pack providing this template, if any.
          type: string
        flow:
          description: Raw template flow JSON, ready to clone and edit as a new flow.
          type: object

    ChatSummary:
      type: object
      required: [id, persona_slug, model_name, created_at, turn_count]
      properties:
        id:
          type: string
        persona_slug:
          type: string
        model_name:
          type: string
        created_at:
          description: RFC3339 timestamp.
          type: string
        turn_count:
          description: Number of user messages in the chat.
          type: integer

    ChatMessage:
      description: >-
        One message in a chat. The `role` field discriminates the variant; the
        remaining fields vary by role.
      type: object
      required: [role]
      oneOf:
        - title: User
          type: object
          required: [role, content]
          properties:
            role:
              type: string
              enum: [user]
            content:
              type: string
        - title: Assistant
          type: object
          required: [role, content]
          properties:
            role:
              type: string
              enum: [assistant]
            content:
              type: string
        - title: ToolCall
          type: object
          required: [role, id, name, args]
          properties:
            role:
              type: string
              enum: [tool_call]
            id:
              type: string
            call_id:
              type: string
            name:
              type: string
            args:
              type: object
        - title: ToolResult
          type: object
          required: [role, id, name, result]
          properties:
            role:
              type: string
              enum: [tool_result]
            id:
              type: string
            call_id:
              type: string
            name:
              type: string
            result:
              type: string
      discriminator:
        propertyName: role

    ChatDetail:
      type: object
      required: [id, persona_slug, model_name, created_at, messages]
      properties:
        id:
          type: string
        persona_slug:
          type: string
        model_name:
          type: string
        created_at:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'

    CreateChatRequest:
      type: object
      required: [persona_slug]
      properties:
        persona_slug:
          type: string
        model_name:
          description: Model override. Defaults to the server's default model.
          type: string

    ChatTurnRequest:
      type: object
      required: [message]
      properties:
        message:
          description: The user's input for this turn.
          type: string

    ChatEvent:
      description: >-
        One event in the SSE stream from a chat turn. The `kind` field
        discriminates the variant. A turn emits `turn_started`, then zero or
        more LLM/tool cycles, then a terminal `done`.
      type: object
      required: [kind]
      oneOf:
        - title: TurnStarted
          type: object
          required: [kind, turn_index, user_message]
          properties:
            kind:
              type: string
              enum: [turn_started]
            turn_index:
              type: integer
            user_message:
              type: string
        - title: LlmStarted
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [llm_started]
        - title: LlmCompleted
          type: object
          required: [kind, messages, duration_ms]
          properties:
            kind:
              type: string
              enum: [llm_completed]
            messages:
              type: array
              items:
                $ref: '#/components/schemas/ChatMessage'
            duration_ms:
              type: integer
        - title: ToolStarted
          type: object
          required: [kind, tool_call_id, name, args]
          properties:
            kind:
              type: string
              enum: [tool_started]
            tool_call_id:
              type: string
            name:
              type: string
            args:
              type: object
        - title: ToolCompleted
          type: object
          required: [kind, tool_call_id, name, duration_ms, result]
          properties:
            kind:
              type: string
              enum: [tool_completed]
            tool_call_id:
              type: string
            name:
              type: string
            duration_ms:
              type: integer
            result:
              $ref: '#/components/schemas/ChatMessage'
        - title: Done
          type: object
          required: [kind, status]
          properties:
            kind:
              type: string
              enum: [done]
            status:
              type: string
              enum: [completed, interrupted, failed]
            reason:
              type: string
      discriminator:
        propertyName: kind

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

paths:
  /api/v1/snapshot:
    get:
      summary: Full project snapshot
      operationId: getSnapshot
      responses:
        '200':
          description: Project snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSnapshot'
        '401':
          description: Unauthorized

  /api/v1/personas/{slug}:
    get:
      summary: Load one persona
      operationId: getPersona
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Persona data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Create or update a persona
      operationId: putPersona
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Persona'
      responses:
        '200':
          description: Persona saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persona'
        '400':
          description: Invalid persona data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a persona
      operationId: deletePersona
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/skills/{slug}:
    get:
      summary: Load one skill
      operationId: getSkill
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Skill data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Create or update a skill
      operationId: putSkill
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Skill'
      responses:
        '200':
          description: Skill saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill'
        '400':
          description: Invalid skill data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a skill
      operationId: deleteSkill
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/flows/{id}:
    get:
      summary: Load one flow
      operationId: getFlow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Flow data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFlow'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Create or update a flow
      operationId: putFlow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedFlow'
      responses:
        '200':
          description: Flow saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedFlow'
        '400':
          description: Invalid flow data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a flow
      operationId: deleteFlow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/diagnostics:
    get:
      summary: List diagnostics sessions
      operationId: listDiagnostics
      responses:
        '200':
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiagnosticsSessionSummary'

  /api/v1/diagnostics/{id}:
    get:
      summary: Load one diagnostics session
      operationId: getDiagnosticsSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsSession'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/api-tools:
    get:
      summary: List API tool configs
      operationId: listApiTools
      responses:
        '200':
          description: List of API tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiToolSummary'

  /api/v1/api-tools/{name}:
    get:
      summary: Load one API tool config
      operationId: getApiTool
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: API tool config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiToolConfig'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Create or update an API tool config
      operationId: putApiTool
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiToolConfig'
      responses:
        '200':
          description: API tool saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiToolConfig'
        '400':
          description: Invalid config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an API tool config
      operationId: deleteApiTool
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/keys:
    get:
      summary: List stored API keys (values masked)
      operationId: listKeys
      responses:
        '200':
          description: Keys with masked values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeySummary'

  /api/v1/keys/recommended:
    get:
      summary: Keys recommended by enabled integration packs
      description: >-
        Aggregates `requires_env` across all enabled packs and flags each key as
        configured or missing. Drives the "keys these packs still need" hint in
        the key store UI — enabling a pack does not block on missing keys.
      operationId: listRecommendedKeys
      responses:
        '200':
          description: Recommended keys with configured/missing flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecommendedKey'

  /api/v1/keys/{name}:
    put:
      summary: Create or update an API key
      description: The key name comes from the path; the raw secret from the body.
      operationId: putKey
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyValueBody'
      responses:
        '200':
          description: Key saved (value returned masked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeySummary'
        '400':
          description: Empty key name or value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to persist the key store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an API key
      operationId: deleteKey
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Failed to persist the key store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/integrations:
    get:
      summary: List installed integration packs
      operationId: listIntegrationPacks
      responses:
        '200':
          description: Installed packs with enable state and content counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntegrationPackSummary'

  /api/v1/integrations/{id}:
    get:
      summary: Load one integration pack
      operationId: getIntegrationPack
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pack detail with the slugs/names of items it provides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationPackDetail'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/integrations/{id}/enabled:
    put:
      summary: Enable or disable an integration pack
      description: >-
        Non-blocking — a pack can be enabled with required keys still missing.
        Use `GET /api/v1/keys/recommended` to see which keys the now-enabled
        packs still need.
      operationId: putPackEnabled
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEnabledRequest'
      responses:
        '204':
          description: Enable state updated
        '400':
          description: Pack not installed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/flows/{id}/run:
    post:
      summary: Run a saved flow now
      description: >-
        Executes the flow's prompts in order and returns a per-prompt result.
        The request body is optional — omit it to run as `coding-agent` on the
        default model.
      operationId: runFlow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunFlowRequest'
      responses:
        '200':
          description: Flow run results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunFlowResponse'
        '400':
          description: Flow is not runnable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Flow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Agent runtime not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/flow-templates:
    get:
      summary: List flow templates
      operationId: listFlowTemplates
      responses:
        '200':
          description: Available flow templates (local and from enabled packs)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlowTemplateSummary'

  /api/v1/flow-templates/{slug}:
    get:
      summary: Load one flow template
      operationId: getFlowTemplate
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Flow template with its raw flow JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowTemplate'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Template failed to parse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/chats:
    get:
      summary: List chats
      operationId: listChats
      responses:
        '200':
          description: Chats, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatSummary'
    post:
      summary: Create a chat
      operationId: createChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatRequest'
      responses:
        '201':
          description: Chat created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSummary'
        '400':
          description: Persona not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/chats/{id}:
    get:
      summary: Load one chat with its full message history
      operationId: getChat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chat detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatDetail'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a chat
      operationId: deleteChat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/chats/{id}/turn:
    post:
      summary: Send a message and stream the agent's turn
      description: >-
        Streams the turn as Server-Sent Events (`text/event-stream`). Each event
        is a JSON `ChatEvent`: a `turn_started`, then zero or more LLM/tool
        cycles, then a terminal `done`.
      operationId: chatTurn
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatTurnRequest'
      responses:
        '200':
          description: SSE stream of chat events
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatEvent'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Chat is already mid-turn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Agent runtime not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
