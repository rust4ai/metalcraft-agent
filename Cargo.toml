[package]
name = "metalcraft-agent"
version = "0.2.0"
edition = "2021"
default-run = "metalcraft-agent"
description = "Interactive AI coding agent with personas, skills, and tool approval"
license = "MIT"
repository = "https://github.com/rust4ai/metalcraft-agent"

[dependencies]
metalcraft = { version = "0.3.3", features = ["rig"] }
metalcraft-flows = "0.1.0"
rig = "0.36"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
dotenvy = "0.15"
rustyline = "15"
crossterm = "0.29"
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
htmd = "0.1"
chalk-plus = "0.1.0"
syntect = "5.3.0"
cron = "0.15"
dirs = "6"
atty = "0.2"
chrono = "0.4"
axum = "0.8"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "metalcraft-agent"
path = "src/main.rs"

[dev-dependencies]
spice-framework = "0.1"
