[package]
name = "metalcraft-agent"
version = "0.10.1"
edition = "2024"
default-run = "metalcraft-agent"
description = "Interactive AI coding agent with personas, skills, and tool approval"
license = "MIT"
repository = "https://github.com/rust4ai/metalcraft-agent"

[dependencies]
metalcraft = { version = "0.8.0", features = ["rig"] }
metalcraft-flows = "0.2.2"
rig = "0.37"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
dotenvy = "0.15"
rustyline = "15"
crossterm = "0.29"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "multipart"], default-features = false }
htmd = "0.1"
chalk-plus = "0.1.0"
syntect = "5.3.0"
cron = "0.15"
dirs = "6"
atty = "0.2"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
hex = "0.4"
include_dir = "0.7"
axum = { version = "0.8", features = ["macros"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
imap = "2"
mail-parser = "0.11"
native-tls = "0.2"

[[bin]]
name = "metalcraft-agent"
path = "src/main.rs"

[[bin]]
name = "metalcraft-daemon"
path = "src/bin/metalcraft-daemon.rs"

[dev-dependencies]
spice-framework = "0.1"
tempfile = "3"
