name: build-and-push

# Builds the daemon image on GitHub's runners and pushes it to GHCR so the VPS
# never has to compile Rust. Triggers:
#   - push to master       -> tags `latest` + the git sha
#   - push of a v* tag      -> tags the semver (e.g. 0.5.1, 0.5, plus latest)
#
# On a v* tag it ALSO publishes the crate to crates.io (so `cargo install
# metalcraft-agent` stays in step with releases). That step needs a
# CARGO_REGISTRY_TOKEN repo secret; it self-skips if the version is already up.
on:
  push:
    branches: [master]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # rust4ai/metalcraft-agent

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # required to push to GHCR with GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-crate:
    # Publish to crates.io on version tags only, after the image builds — keeps
    # `cargo install metalcraft-agent` in step with releases. Needs the
    # CARGO_REGISTRY_TOKEN repo secret (a crates.io API token with publish
    # scope). Idempotent: self-skips if this version is already published, so a
    # re-run of the tag can't fail here.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Skip if version already on crates.io
        id: check
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sf "https://crates.io/api/v1/crates/metalcraft-agent/$VERSION" >/dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "metalcraft-agent $VERSION already on crates.io — skipping publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to crates.io
        if: steps.check.outputs.already == 'false'
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
