# Single-daemon compose with no reverse proxy — the Workshop API is published
# directly on the host. Good for local runs and private/trusted networks.
#
# For public HTTPS, use docker-compose.caddy.yml instead (Caddy + Let's Encrypt).
#
# Setup:
#   1. Copy .env.example to .env and set at least OPENAI_API_KEY.
#      Set WORKSHOP_API_KEY to enable the HTTP API + webhooks.
#   2. docker compose up -d        # pulls the prebuilt GHCR image
#      docker compose up -d --build # or build from source locally
#   3. Verify:  curl http://localhost:3002/health

services:
  daemon:
    # On a host: `docker compose pull && up -d` pulls this prebuilt image from
    # GHCR. Locally, `up --build` builds from source via `build:`.
    image: ghcr.io/rust4ai/metalcraft-agent:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      WORKSHOP_API_KEY: ${WORKSHOP_API_KEY}   # enables the Workshop API + /api/v1 auth
      PORT: "3002"                            # Workshop API binds 0.0.0.0:3002
      METALCRAFT_DATA_DIR: /data
      RUST_LOG: info
    volumes:
      - daemon-data:/data
    restart: unless-stopped

volumes:
  daemon-data:
